<!-- templates/core/cliente_form.html -->
{% extends 'base.html' %}

{% block titulo %}{{ titulo }} — NFS-e Manager{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">
                <i class="bi bi-person-plus me-2"></i>{{ titulo }}
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {% for erro in field.errors %}{{ erro }}{% endfor %}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-verde">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                        <a href="{% url 'cliente_lista' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
