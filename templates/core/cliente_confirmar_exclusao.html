<!-- templates/core/cliente_confirmar_exclusao.html -->
{% extends 'base.html' %}

{% block titulo %}Excluir Cliente{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white fw-semibold">
                <i class="bi bi-exclamation-triangle me-2"></i>Confirmar Exclusão
            </div>
            <div class="card-body text-center py-4">
                <p class="fs-5">Deseja excluir o cliente:</p>
                <p class="fw-bold fs-4">{{ objeto.nome }}</p>
                <p class="text-muted small">Esta ação não pode ser desfeita.</p>
                <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Sim, excluir
                    </button>
                    <a href="{% url 'cliente_lista' %}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
